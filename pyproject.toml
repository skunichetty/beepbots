[project]
name = "beepbots"
version = "0.1.0"
description = "Experiments with reinforcement learning"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "battlebots",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "plotly>=6.5.2",
    "polars>=1.37.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "nbformat>=5.10.4",
]

[tool.uv.workspace]
members = [
    "battlebots",
]

[tool.uv.sources]
battlebots = { workspace = true, editable = true }
